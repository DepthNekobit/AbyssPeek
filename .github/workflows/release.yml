name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "作成するリリースタグ (例: v1.0.0)。空ならビルドのみ"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        shell: pwsh
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          $appVersion = python -c "from src.version import APP_VERSION; print(APP_VERSION)"
          if ($env:TAG_NAME -ne "v$appVersion") {
            throw "Release tag $env:TAG_NAME does not match app version v$appVersion"
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Remove unused optional Qt DLLs
        shell: pwsh
        run: |
          # 本アプリは OpenGL を使わないため、Mesa 由来のソフトウェア OpenGL レンダラー
          # (opengl32sw.dll) を exe に同梱しない (PyInstaller は存在すれば自動で収集する)
          $pyside = python -c "import pathlib, PySide6; print(pathlib.Path(PySide6.__file__).parent)"
          Get-ChildItem $pyside -Recurse -Filter opengl32sw.dll | Remove-Item -Verbose

      - name: Collect Python license
        shell: pwsh
        run: |
          # Windows 版 Python はインストール先直下、その他は標準ライブラリ内に LICENSE.txt がある
          $pyLicense = python -c "import sys, sysconfig, pathlib; c = [pathlib.Path(sys.base_prefix, 'LICENSE.txt'), pathlib.Path(sysconfig.get_path('stdlib'), 'LICENSE.txt')]; print(next((str(p) for p in c if p.is_file()), ''))"
          if (-not $pyLicense) { throw "Python LICENSE.txt not found" }
          Copy-Item $pyLicense licenses\LICENSE-Python.txt

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --noconsole
          --name AbyssPeek
          --icon assets/icon/abysspeek.ico
          --add-data "assets;assets"
          --add-data "LICENSE;."
          --add-data "THIRD_PARTY_NOTICES.md;."
          --add-data "licenses;licenses"
          main.py

      - name: Smoke test (exe が起動し続けるか)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist\AbyssPeek.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "AbyssPeek.exe exited early (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id
          Write-Host "smoke test OK"

      - name: Zip exe
        shell: pwsh
        run: |
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md dist\
          Copy-Item licenses dist\licenses -Recurse
          Compress-Archive -Path dist\AbyssPeek.exe, dist\LICENSE, dist\THIRD_PARTY_NOTICES.md, dist\licenses -DestinationPath dist\AbyssPeek-windows.zip

      - name: Upload artifact (手動実行時)
        # リリース作成時 (タグ push / タグ指定の手動実行) は Releases に添付するため不要
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '') }}
        uses: actions/upload-artifact@v4
        with:
          name: AbyssPeek-windows
          path: |
            dist/AbyssPeek.exe
            dist/AbyssPeek-windows.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          $notes = @"
          ## AbyssPeek $env:TAG_NAME

          メールヘッダーを安全にデコード・解析するデスクトップツール(Windows 用)。

          ### ダウンロード
          - **AbyssPeek.exe** — そのまま実行できる単一ファイル版
          - **AbyssPeek-windows.zip** — 上記の zip 版(ライセンス文書同梱。exe の直接ダウンロードが制限されている環境向け)

          ### ライセンス
          - AbyssPeek は MIT License です。Qt for Python (PySide6) を LGPLv3 の条件で使用しています。
          - サードパーティのライセンスは zip 内の THIRD_PARTY_NOTICES.md / licenses/ またはアプリの「ヘルプ → サードパーティ ライセンス」で確認できます。

          ### 注意
          - コード署名をしていないため、初回起動時に Windows SmartScreen の警告が出ることがあります。「詳細情報 → 実行」で起動できます。
          - 初回起動は展開処理のため数秒かかります。
          "@
          gh release create $env:TAG_NAME `
            dist/AbyssPeek.exe `
            dist/AbyssPeek-windows.zip `
            --title "AbyssPeek $env:TAG_NAME" `
            --target $env:GITHUB_SHA `
            --notes $notes
